<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Send SMS — Job Composer</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; margin: 0; padding: 0; color: #1f2937; background: #e5e7eb; }
    .frame { max-width: 480px; margin: 24px auto; background: #fff; border-radius: 10px; overflow: hidden; box-shadow: 0 20px 40px rgba(0,0,0,0.12); border: 1px solid #d1d5db; }
    .composer-header { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-bottom: 1px solid #e5e7eb; background: #fafafa; }
    .composer-header h1 { margin: 0; font-size: 15px; font-weight: 600; }
    .icon-btn { background: none; border: none; color: #6b7280; font-size: 18px; }
    .job-context { padding: 12px 16px; background: #f8fafc; border-bottom: 1px solid #e5e7eb; display: grid; grid-template-columns: 1fr 1fr; gap: 8px 16px; font-size: 12px; }
    .job-context dt { color: #6b7280; font-weight: 500; }
    .job-context dd { margin: 2px 0 0; color: #111827; font-weight: 600; }
    .composer-body { padding: 16px; }
    label { display: block; font-size: 12px; font-weight: 600; color: #374151; margin-bottom: 4px; }
    select, textarea { width: 100%; padding: 8px; margin: 4px 0 12px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 13px; font-family: inherit; }
    textarea { min-height: 90px; resize: vertical; }
    .char-row { display: flex; justify-content: space-between; font-size: 11px; color: #6b7280; margin-bottom: 12px; }
    .preview-bubble { background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 10px; padding: 10px 12px; font-size: 13px; line-height: 1.5; color: #14532d; margin-bottom: 14px; }
    .preview-bubble strong { display: block; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; color: #166534; margin-bottom: 4px; }
    .composer-footer { display: flex; gap: 8px; justify-content: flex-end; padding: 12px 16px; border-top: 1px solid #e5e7eb; background: #fafafa; }
    button { padding: 8px 14px; background: #3b82f6; color: #fff; border: none; border-radius: 6px; font-size: 13px; }
    button.secondary { background: #fff; color: #374151; border: 1px solid #d1d5db; }
  </style>
</head>
<body>
  <div class="frame">
    <div class="composer-header">
      <h1>Send SMS</h1>
      <span class="icon-btn">×</span>
    </div>
    <dl class="job-context">
      <div><dt>Job</dt><dd>J-1042</dd></div>
      <div><dt>Status</dt><dd>En Route</dd></div>
      <div><dt>Customer</dt><dd>Jane Smith</dd></div>
      <div><dt>Address</dt><dd>12 Oak St, Brisbane</dd></div>
    </dl>
    <div class="composer-body">
      <label>Recipient</label>
      <select><option>Jane Smith — 0412 345 678</option></select>
      <label>Template</label>
      <select><option>Technician en route</option><option>Booking confirmed</option><option>Job completed</option></select>
      <label>Message</label>
      <textarea>Hi Jane, our technician is en route to 12 Oak St for job J-1042. ETA ~20 mins. Reply STOP to opt out.</textarea>
      <div class="char-row"><span>1 SMS segment</span><span>118 / 160</span></div>
      <div class="preview-bubble">
        <strong>Preview</strong>
        Hi Jane, our technician is en route to 12 Oak St for job J-1042. ETA ~20 mins. Reply STOP to opt out.
      </div>
    </div>
    <div class="composer-footer">
      <button class="secondary">Cancel</button>
      <button>Send SMS</button>
    </div>
  </div>
</body>
</html>
